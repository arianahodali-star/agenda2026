<style>
:root{
  --maroon:#4A0B12;
  --rose:#C4687F;
  --rose-deep:#A94A65;
  --pink:#F2CFD6;
  --pink-soft:#FBEAEE;
  --dot:#F2A9BC;
  --ink:#3B1B22;
  --paper:#FFFCFA;
  --rule:#E9D8DD;
  --rule-strong:#DCC2C9;
  --muted:#9B7480;
  --now:#C4687F;
  --focus:#A94A65;
  --f-title:"Playfair Display",Georgia,serif;
  --f-disp:"Quicksand",'Trebuchet MS',sans-serif;
  --f-body:"Nunito",-apple-system,Segoe UI,Roboto,sans-serif;
  --spine:74px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
html{-webkit-text-size-adjust:100%}
body{
  background:#E7CDD3;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;touch-action:manipulation}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--pink)}

/* ---------- cabecera ---------- */
.jt-rail{background:var(--maroon);color:#F7E4E8;position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top)}
.jt-rail-top{display:flex;align-items:center;gap:8px;padding:11px 18px 6px;flex-wrap:wrap}



.jt-new{
  background:var(--pink);color:var(--maroon);font-family:var(--f-disp);font-weight:700;
  font-size:14.5px;padding:11px 18px;border-radius:99px;min-height:44px;
}
.jt-new:active{transform:scale(.97)}
.jt-icon{color:#D7AEB6;padding:11px 13px;border-radius:99px;font-size:13.5px;font-weight:700;min-height:44px}
.jt-icon:active{background:rgba(255,255,255,.12)}
.jt-icon[aria-pressed="true"]{background:var(--pink);color:var(--maroon)}
.jt-rail-bot{display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
.jt-date{font-family:var(--f-title);font-size:23px;line-height:1.15;font-weight:600;margin-right:auto;color:#F7E4E8}
.jt-date em{font-style:italic;color:#C79AA4;font-weight:400}
.jt-nav{display:flex;align-items:center;gap:6px}
.jt-nav button{
  color:var(--pink);background:rgba(255,255,255,.10);min-width:46px;min-height:44px;padding:0 15px;
  border-radius:99px;font-family:var(--f-disp);font-weight:700;font-size:15px;
}
.jt-nav button:active{background:rgba(255,255,255,.22)}
.jt-search{background:rgba(255,255,255,.10);border:1px solid #6E2731;color:#F7E4E8;padding:11px 16px;border-radius:99px;width:190px;min-height:44px}
.jt-search::placeholder{color:#B98A94}





/* ---------- cuerpo de la agenda ---------- */
.jt-wrap{max-width:1200px;margin:0 auto;padding:0 10px 80px}
.jt-page{background:var(--paper);border-radius:0 0 14px 14px;position:relative;padding-left:var(--spine);box-shadow:0 16px 36px rgba(74,11,18,.22)}
/* lomo con puntos, como la referencia */
.jt-spine{border:none;padding:0;
  position:absolute;left:0;top:0;bottom:0;width:var(--spine);background:var(--maroon);
  background-image:radial-gradient(circle, var(--dot) 0 2px, transparent 2.4px);
  background-size:22px 22px;background-position:11px 11px;border-radius:0 0 0 14px;
}
.jt-spine b{
  position:absolute;left:50%;top:120px;transform:translateX(-50%) rotate(90deg);transform-origin:center;
  font-family:var(--f-script);font-size:26px;color:var(--pink);white-space:nowrap;
}
@media(max-width:700px){:root{--spine:34px}.jt-spine b{display:none}}
.jt-inner{padding:16px 18px 26px}
@media(max-width:700px){.jt-inner{padding:12px 10px 20px}}

/* ---------- hoja con proporción de agenda ---------- */
.pg{position:relative;background:var(--paper)}




/* encabezado de hoja, aire de planner impreso */
.pl-title{position:relative;text-align:center;margin:6px 0 20px}
.pl-title h2{
  margin:0;font-family:var(--f-disp);font-weight:500;font-size:clamp(26px,5.4vw,52px);
  letter-spacing:.20em;text-transform:uppercase;color:var(--ink);line-height:1;
}
.pl-title .script{display:block;font-family:var(--f-disp);font-weight:600;font-size:clamp(11px,1.7vw,14px);letter-spacing:.22em;text-transform:uppercase;color:var(--rose);margin-top:9px;line-height:1.3}
.pl-title .rule{height:1px;background:var(--rule-strong);margin:14px 0 0}
.pg-head{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--maroon);padding-bottom:8px;margin-bottom:14px}
.pg-head h2{margin:0;font-family:var(--f-title);font-size:26px;font-weight:700;line-height:1}
.pg-head h2 em{font-style:italic;color:var(--rose);font-weight:400}
.pg-head .sub{font-family:var(--f-disp);font-weight:700;font-size:12px;color:var(--muted);margin-left:auto;text-transform:uppercase;letter-spacing:.14em}

/* recuadros para escribir */
.box{background:#fff;border:1px solid var(--rule-strong);border-radius:10px;padding:10px 14px 14px;display:flex;flex-direction:column;min-height:322px;position:relative;overflow:hidden}
.box.claro{background:#FFFDFC}
.box.hoy{background:#FFF8FA}
.box>h4{border-bottom:1px solid var(--rule-strong);padding-bottom:7px;
  margin:0 0 8px;font-family:var(--f-disp);font-weight:700;font-size:12.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--maroon);display:flex;align-items:center;gap:8px;
}
.box>h4 .dia{font-family:var(--f-title);font-style:italic;font-size:18px;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1}
.box>h4 u{margin-left:auto;text-decoration:none;font-size:11px;color:var(--muted);letter-spacing:0}
.box .add{margin-left:auto;color:var(--rose);font-size:20px;line-height:1;width:34px;height:34px;border-radius:99px}
.box .add:active{background:#fff}
.box .cuerpo{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
textarea.lines{flex:1;width:100%;display:block;box-sizing:border-box;border:none;outline:none;resize:none;overflow:hidden;font-family:var(--f-body);font-size:16px;line-height:32px;color:var(--ink);padding:0;margin:0;background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);background-color:transparent;background-attachment:local;background-position:0 0;-webkit-user-select:text;}
textarea.lines::placeholder{color:#C9AFB6}
.box.hoy{outline:2px solid var(--rose);outline-offset:-2px}

/* ---------- portada ---------- */
.v-portada .jt-inner{padding:0}
.v-portada{--spine:13%;--mrail:0px}
.v-portada .jt-rail{display:none}
.v-portada .jt-wrap{padding-top:14px}
.v-portada .mrail{display:none}
.v-portada .jt-page{border-radius:0 0 14px 14px;overflow:hidden}
.cover{
  display:block;width:100%;aspect-ratio:1/1.487;background:var(--pink);
  position:relative;overflow:hidden;text-align:left;
}
.cover .field{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  container-type:inline-size;
}
.cover .yr{
  display:grid;grid-template-columns:1fr 1fr;width:100%;
  font-family:"Bodoni Moda",Didot,"Playfair Display",Georgia,serif;
  font-weight:500;font-variation-settings:"opsz" 96;font-optical-sizing:auto;
  color:var(--rose);line-height:.745;letter-spacing:-.01em;
  font-size:min(47vw,300px);
}

/* ---------- vista anual ---------- */
.yearg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.yearg{grid-template-columns:repeat(3,1fr);gap:12px}}
@media(max-width:600px){.yearg{grid-template-columns:repeat(2,1fr);gap:10px}}
.mini{text-align:left;border:1px solid var(--rule);border-radius:10px;padding:9px;background:#fff}

.mini table{width:100%;border-collapse:collapse;font-family:var(--f-disp);font-size:9.5px;font-weight:600}
.mini th{color:var(--muted);font-weight:700;padding:1px 0}
.mini td{text-align:center;padding:1.5px 0;color:#6E5058;position:relative}
.mini td.off{color:#D6C3C8}

.mini td.tiene::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:3px;height:3px;border-radius:99px;background:var(--rose)}

/* ---------- semana en apartados ---------- */
.wk{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.wk{grid-template-columns:1fr;gap:11px}}

/* fila de entrada dentro de la agenda clásica */
.row{display:flex;align-items:flex-start;gap:7px;text-align:left;width:100%;padding:3px 2px;min-height:26px}
.row:active{background:var(--pink-soft)}
.row i.b{width:7px;height:7px;border-radius:99px;flex:none;margin-top:7px}

.row.done .ck i{background:var(--rose);border-color:var(--rose);color:#fff}

/* ---------- mes ---------- */
.mes-wrap{position:relative}
.jt-month{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule-strong);position:relative;z-index:1;background:transparent}
.jt-mdow{font-family:var(--f-disp);font-weight:700;font-size:11.5px;color:var(--maroon);padding:9px 5px;text-align:center;background:var(--pink-soft);text-transform:uppercase;letter-spacing:.14em;border-bottom:1px solid var(--rule-strong)}
.jt-mcell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:104px;padding:6px;background:transparent;display:flex;flex-direction:column;gap:3px;text-align:left}
.jt-mcell:nth-child(7n+7){border-right:none}
.jt-mcell:active{background:var(--pink-soft)}
.jt-mcell.off{color:#CFBAC0;opacity:.55}
.jt-mcell .n{font-family:var(--f-title);font-weight:700;font-size:17px;align-self:flex-start;padding:0 6px;line-height:1.25}
.jt-mcell.today .n{background:var(--rose);color:#fff;border-radius:99px}
.jt-mline{display:flex;align-items:center;gap:5px;font-size:10.5px;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.jt-dot{width:7px;height:7px;border-radius:99px;flex:none}
.jt-more{font-family:var(--f-disp);font-weight:700;font-size:10px;color:var(--muted)}
@media(max-width:700px){.jt-mcell{min-height:74px;padding:3px}.jt-mline{font-size:9px}.jt-mcell .n{font-size:14px}}

/* bloques inferiores del mes */
.mes-abajo{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
@media(max-width:700px){.mes-abajo{grid-template-columns:1fr}}
.todo-lineas{display:flex;flex-direction:column;gap:0}
.todo-l{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule-strong);min-height:38px;padding:2px 0}
.todo-l i.cj{width:16px;height:16px;border:1.5px solid var(--rule-strong);border-radius:3px;flex:none;background:#fff;display:grid;place-items:center;font-size:11px;color:var(--rose)}
.todo-l.ok i.cj{background:var(--rose);border-color:var(--rose);color:#fff}
.todo-l .tx{font-size:13.5px;flex:1;text-align:left}
.todo-l.ok .tx{text-decoration:line-through;opacity:.5}

.jt-cols{display:grid;grid-template-columns:1fr 268px;gap:24px;align-items:start}
@media(max-width:1000px){.jt-cols{grid-template-columns:1fr;gap:18px}}
.jt-card{margin-bottom:6px}
.jt-head{display:flex;align-items:center;gap:10px;padding:0 0 7px;margin-bottom:9px;border-bottom:1.5px solid var(--maroon)}
.jt-head h2{margin:0;font-family:var(--f-title);font-size:19px;font-weight:700;font-style:italic}
.jt-count{font-family:var(--f-disp);font-weight:700;font-size:12px;color:var(--muted);margin-left:auto}
button.jt-count{min-height:40px;padding:0 10px;border-radius:99px}
.jt-projlist{display:flex;flex-direction:column;gap:1px}
.jt-proj{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:13.5px;text-align:left;width:100%;border-radius:8px;min-height:44px}
.jt-proj:active{background:var(--pink-soft)}
.jt-proj[aria-pressed="true"]{background:var(--pink-soft);font-weight:700}
.jt-proj u{margin-left:auto;font-family:var(--f-disp);font-weight:700;font-size:12px;color:var(--muted);text-decoration:none}
.jt-empty{padding:20px 12px;text-align:center;color:var(--muted);font-size:13.5px}

.jt-side{display:flex;flex-direction:column;gap:20px}
@media(min-width:1001px){.jt-side{position:sticky;top:150px}}

/* carga del día */
.jt-load{display:flex;height:8px;background:var(--pink-soft);border-radius:99px;overflow:hidden;margin:0 0 14px}
.jt-load i{display:block;height:100%}
.jt-loadtxt{display:flex;justify-content:space-between;font-family:var(--f-disp);font-weight:700;font-size:11.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}

/* línea de la hora actual */
.jt-nowline{position:absolute;left:56px;right:0;height:0;border-top:1.5px solid var(--now);z-index:4;pointer-events:none}
.jt-nowline b{position:absolute;left:-56px;top:-9px;background:var(--now);color:#fff;font-family:var(--f-disp);font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:99px}

/* ---------- barra del lápiz ---------- */





.ink-rueda{
  margin-left:2px;
  position:relative;width:38px;height:38px;border-radius:99px;display:grid;place-items:center;flex:none;
  background:conic-gradient(#E5484D,#F2A93B,#F5D547,#57B25B,#3BB8C4,#3D6BC9,#8A4FC7,#D93F8E,#E5484D);
}

.jt-seg{display:flex;gap:8px}
.jt-seg button{flex:1;padding:12px 4px;font-family:var(--f-disp);font-weight:700;font-size:14px;min-height:48px;color:var(--muted);border:1.5px solid var(--rule-strong);border-radius:9px;background:#fff}

.jt-ghost{border:1.5px solid var(--rule-strong);padding:12px 16px;border-radius:99px;min-height:48px;font-family:var(--f-disp);font-weight:700;font-size:13.5px;color:var(--muted);background:#fff}

<script>
(function(){
"use strict";

/* ============ estado ============ */
const DB = (function(){
  if(typeof window !== "undefined" && window.storage) return window.storage;
  const P = "agendaLS:";
  const ok = (function(){ try{ localStorage.setItem(P+"t","1"); localStorage.removeItem(P+"t"); return true; }catch(e){ return false; } })();
  if(!ok) return null;
  return {
    get: async k=>{ const v = localStorage.getItem(P+k); if(v===null) throw new Error("no existe"); return {key:k, value:v}; },
    set: async (k,v)=>{ localStorage.setItem(P+k, v); return {key:k, value:v}; },
    delete: async k=>{ localStorage.removeItem(P+k); return {key:k, deleted:true}; },
    list: async ()=>({keys:Object.keys(localStorage).filter(x=>x.indexOf(P)===0).map(x=>x.slice(P.length))})
  };
})();

const KEY = "agenda:ari:v1";
let S = { items: [], projects: [], hojas: {}, notas: {}, colores: {}, colorTexto: "#3B1B22" };
let view = "portada";
let cursor = new Date();
let filterProj = null;
let query = "";
let saveTimer = null;
let memoryOnly = false;

const PALETTE = ["#F292B8","#C9A7EE","#8FCFE0","#F7B267","#9BD8B4","#EF7BA6","#B9A0E8","#F5C6D6","#7EC4CF","#E5A0C4"];
const SEED_PROJECTS = [
  {id:"p1", nombre:"Campañas y contenido", color:"#F292B8"},
  {id:"p2", nombre:"Redes sociales", color:"#C9A7EE"},
  {id:"p3", nombre:"Clientes y cuentas", color:"#8FCFE0"},
  {id:"p4", nombre:"Diseño y piezas", color:"#F7B267"},
  {id:"p5", nombre:"Reuniones internas", color:"#9BD8B4"},
  {id:"p6", nombre:"Proveedores", color:"#EF7BA6"},
  {id:"p7", nombre:"Reportes y métricas", color:"#B9A0E8"},
  {id:"p8", nombre:"Personal", color:"#F5C6D6"}
];

/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fromISO(s){ const p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayISO(){ return iso(new Date()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function diffDays(a,b){ return Math.round((fromISO(a)-fromISO(b))/86400000); }
function minutes(hhmm){ if(!hhmm) return null; const p=hhmm.split(":"); return (+p[0])*60 + (+p[1]); }
function fmtLong(d){
  const s = d.toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
let DAY_RANGE = [7,21];
function hourRange(timed){
  let lo = 7, hi = 22;
  timed.forEach(i=>{
    const a = minutes(i.hora); const b = i.fin ? minutes(i.fin) : a+60;
    lo = Math.min(lo, Math.floor(a/60));
    hi = Math.max(hi, Math.ceil(b/60));
  });
  return [Math.max(0,lo), Math.min(24,Math.max(hi, lo+1))];
}
function projOf(id){ return S.projects.find(p=>p.id===id) || null; }
function colorOf(it){ const p = projOf(it.proyecto); return p ? p.color : "#9AA096"; }

function toast(msg){
  const t = el("jtToast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2200);
}

/* ============ almacenamiento ============ */
async function load(){
  if(!DB){ memoryOnly = true; }
  try{
    const r = await DB.get(KEY);
    if(r && r.value){ const d = JSON.parse(r.value); S.items = d.items||[]; S.projects = d.projects||SEED_PROJECTS.slice(); S.hojas = d.hojas||{}; S.notas = d.notas||{}; S.colores = d.colores||{}; S.colorTexto = d.colorTexto||"#3B1B22"; }
    else throw new Error("vacío");
  }catch(e){
    S.projects = SEED_PROJECTS.slice(); S.items = []; S.hojas = {}; S.notas = {}; S.colores = {};
    try{ await DB.set(KEY, JSON.stringify(S)); }
    catch(err){ memoryOnly = true; }
  }
  el("jtStatus").textContent = memoryOnly ? "sin guardado automático" : "guardado automático";
}
function save(){
  if(memoryOnly) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await DB.set(KEY, JSON.stringify(S)); }
    catch(e){ memoryOnly = true; el("jtStatus").textContent = "sin guardado automático"; toast("No se pudo guardar. Descarga un respaldo."); }
  }, 350);
}

/* ============ consultas ============ */
function visible(list){
  let out = list;
  if(filterProj) out = out.filter(i=>i.proyecto===filterProj);
  if(query){
    const q = query.toLowerCase();
    out = out.filter(i => (i.titulo+" "+(i.notas||"")+" "+(i.lugar||"")+" "+((projOf(i.proyecto)||{}).nombre||"")).toLowerCase().includes(q));
  }
  return out;
}
function itemsOn(date){
  return visible(S.items.filter(i=>i.fecha===date)).sort(sortItems);
}
function sortItems(a,b){
  if(!!a.hora !== !!b.hora) return a.hora ? 1 : -1;
  if(a.hora && b.hora && a.hora!==b.hora) return a.hora < b.hora ? -1 : 1;
  const pr = {alta:0, media:1, baja:2};
  return (pr[a.prioridad]||1) - (pr[b.prioridad]||1);
}

/* ============ piezas comunes ============ */
const DOWS = ["lun","mar","mié","jue","vie","sáb","dom"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function rowHTML(it, opts){
  opts = opts || {};
  const p = projOf(it.proyecto);
  let meta = "";
  if(opts.showDate) meta = '<span class="h">'+esc(fromISO(it.fecha).toLocaleDateString("es-PE",{day:"numeric",month:"short"}))+'</span>';
  else if(it.hora) meta = '<span class="h">'+esc(it.hora)+'</span>';
  else meta = '<span class="h">·</span>';
  let extra = "";
  if(!it.hecho && it.fecha < todayISO() && opts.showDate){
    extra = ' <b style="color:var(--rose);font-size:10px">('+diffDays(todayISO(), it.fecha)+'d)</b>';
  }
  if(it.prioridad==="alta" && !it.hecho) extra += ' <b style="color:var(--rose)">•</b>';
  return '<div class="row'+(it.hecho?" done":"")+'">'+
    '<i class="b" style="background:'+colorOf(it)+'"></i>'+ meta +
    '<button class="x" data-act="edit" data-id="'+it.id+'" style="text-align:left;background:none">'+esc(it.titulo)+extra+
      (p&&opts.showProj?' <b style="color:var(--muted);font-weight:600;font-size:10.5px">'+esc(p.nombre)+'</b>':'')+'</button>'+
    '<button class="ck" data-act="toggle" data-id="'+it.id+'" title="Marcar"><i>'+(it.hecho?"✓":"")+'</i></button>'+
  '</div>';
}

/* ============ portada ============ */
function renderPortada(){
  const y = String(cursor.getFullYear());
  return '<div class="pg"><button class="cover" data-act="abrir" aria-label="Abrir la agenda"><span class="field">'+
    '<span class="yr"><span>'+y[0]+'</span><span>'+y[1]+'</span><span>'+y[2]+'</span><span>'+y[3]+'</span></span>'+
  '</span></button></div>';
}

function crecer(t){
  const min = parseInt(t.dataset.min||"256",10);
  const alto = Math.max(min, Math.ceil((t.scrollHeight+1)/32)*32);
  if(alto !== parseInt(t.style.height,10)){
    t.style.height = alto+"px";
  }
}
function ajustarAreas(){
  document.querySelectorAll("textarea.lines").forEach(t=>{ t.style.height="0px"; crecer(t); });
}
function areaHTML(clave, alto){
  const v = (S.notas && S.notas[clave]) || "";
  const col = (S.colores && S.colores[clave]) || S.colorTexto || "#3B1B22";
  return '<textarea class="lines" data-nota="'+clave+'" data-min="'+alto+'" style="height:'+alto+'px;color:'+col+'" '+
    'spellcheck="false" autocapitalize="sentences" autocomplete="off" '+
    'aria-label="Escribir">'+esc(v)+'</textarea>';
}
function tituloPlanner(caps, script){
  return '<div class="pl-title"><h2>'+caps+'</h2>'+
    (script ? '<span class="script">'+script+'</span>' : '')+'<div class="rule"></div></div>';
}

/* ============ mes ============ */
function renderMes(){
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const start = startOfWeek(first);
  const hoy = todayISO();
  let html = '<div class="pg" id="jtPg">';
  html += tituloPlanner(MESES[cursor.getMonth()], String(cursor.getFullYear()));
  html += '<div class="jt-month">';
  DOWS.forEach(d=> html += '<div class="jt-mdow">'+d+'</div>');
  for(let i=0;i<42;i++){
    const d = addDays(start,i);
    const ds = iso(d);
    const off = d.getMonth() !== cursor.getMonth();
    const list = itemsOn(ds);
    html += '<button class="jt-mcell'+(off?" off":"")+(ds===hoy?" today":"")+'" data-act="goday" data-date="'+ds+'">';
    html += '<span class="n">'+d.getDate()+'</span>';
    list.slice(0,3).forEach(i=>{
      html += '<span class="jt-mline"><i class="jt-dot" style="background:'+colorOf(i)+'"></i>'+esc(i.titulo)+'</span>';
    });
    if(list.length>3) html += '<span class="jt-more">+'+(list.length-3)+'</span>';
    html += '</button>';
  }
  html += '</div>';
  html += '<div class="box claro" style="margin-top:18px"><h4>Notas del mes</h4>'+
    areaHTML("m:"+cursor.getFullYear()+"-"+pad(cursor.getMonth()+1), 192)+'</div>';
  html += '</div>';
  return html;
}

/* ============ semana ============ */
function renderSemana(){
  const start = startOfWeek(cursor);
  const hoy = todayISO();
  const fin = addDays(start,6);
  const rango = "del "+start.getDate()+" de "+MESES[start.getMonth()]+" al "+fin.getDate()+" de "+MESES[fin.getMonth()];
  const nombres = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

  let html = '<div class="pg" id="jtPg">'+tituloPlanner("Plan semanal", rango)+'<div class="wk">';
  for(let k=0;k<7;k++){
    const d = addDays(start,k);
    const ds = iso(d);
    const list = itemsOn(ds);
    html += '<div class="box'+(ds===hoy?" hoy":"")+'">'+
      '<h4><span class="dia">'+nombres[k]+'</span> '+d.getDate()+
      '<button class="add" data-act="newday" data-date="'+ds+'" title="Agregar">+</button></h4>'+
      (list.length ? '<div class="cuerpo">'+list.map(i=>rowHTML(i)).join("")+'</div>' : '')+
      areaHTML("d:"+ds, 256)+'</div>';
  }
  html += '<div class="box claro"><h4>Notas</h4>'+areaHTML("w:"+iso(start), 256)+'</div>';
  html += '</div>'+'</div>';
  return html;
}









/* ============ pestañas de meses ============ */
function renderRail(){

/* ============ render principal ============ */
function tituloVista(){

function closeModal(){ el("jtModalHost").innerHTML = ""; }

function saveFromModal(id){
  const titulo = el("fTitulo").value.trim();
  if(!titulo){ el("fTitulo").focus(); toast("Ponle un nombre a la entrada"); return; }
  const tipoBtn = document.querySelector('#jtTipo button[aria-pressed="true"]');
  const data = {
    tipo: tipoBtn ? tipoBtn.dataset.t : "tarea",
    titulo: titulo,
    fecha: el("fFecha").value || todayISO(),
    hora: el("fHora").value || "",
    fin: el("fFin").value || "",
    proyecto: el("fProy").value || "",
    prioridad: el("fPrio").value,
    lugar: el("fLugar").value.trim(),
    notas: el("fNotas").value.trim()
  };
  if(id){
    const i = S.items.find(x=>x.id===id);
    Object.assign(i, data);
  }else{
    S.items.push(Object.assign({id:uid(), hecho:false, arrastres:0, creado:Date.now()}, data));
  }
  save(); closeModal(); render(); toast(id?"Entrada actualizada":"Entrada guardada");
}

/* ============ anotación rápida ============ */
function quickAdd(text){
  let t = text.trim(); if(!t) return;
  let fecha = iso(cursor), hora = "", proy = filterProj || "";

  const mProj = t.match(/@([\wÁÉÍÓÚÑáéíóúñ.&/-]+)/);
  if(mProj){
    const name = mProj[1].toLowerCase();
    const p = S.projects.find(x=>x.nombre.toLowerCase().replace(/\s+/g,"").startsWith(name.replace(/\s+/g,"")));
    if(p) proy = p.id;
    t = t.replace(mProj[0],"").trim();
  }
  const mTime = t.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/);
  if(mTime){ hora = pad(+mTime[1])+":"+mTime[2]; t = t.replace(mTime[0],"").trim(); }
  else{
    const mH = t.match(/\b([01]?\d|2[0-3])\s?(am|pm|h)\b/i);
    if(mH){
      let h = +mH[1];
      if(/pm/i.test(mH[2]) && h<12) h+=12;
      if(/am/i.test(mH[2]) && h===12) h=0;
      hora = pad(h)+":00"; t = t.replace(mH[0],"").trim();
    }
  }
  const low = t.toLowerCase();
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  if(/\bhoy\b/.test(low)){ fecha = todayISO(); t = t.replace(/\bhoy\b/i,"").trim(); }
  else if(/\bmañana\b/.test(low)){ fecha = iso(addDays(new Date(),1)); t = t.replace(/\bmañana\b/i,"").trim(); }
  else{
    for(let k=0;k<7;k++){
      const re = new RegExp("\\b"+dias[k]+"\\b","i");
      if(re.test(low)){
        let d = new Date(); let guard=0;
        do{ d = addDays(d,1); guard++; }while(d.getDay()!==k && guard<8);
        fecha = iso(d); t = t.replace(re,"").trim(); break;
      }
    }
  }
  t = t.replace(/\s{2,}/g," ").replace(/^[-–,\s]+|[-–,\s]+$/g,"");
  if(!t){ toast("Escribe qué quieres anotar"); return; }
  const tipo = /reuni[oó]n|meet|llamada|visita|cita/i.test(t) ? "reunion" : (hora ? "actividad" : "tarea");
  S.items.push({id:uid(), tipo:tipo, titulo:t, fecha:fecha, hora:hora, fin:"", proyecto:proy,
    prioridad:"media", lugar:"", notas:"", hecho:false, arrastres:0, creado:Date.now()});
  save(); render();
  toast("Anotado para "+fromISO(fecha).toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long"}));
}

/* ============ acciones ============ */
function toggleDone(id){
  const i = S.items.find(x=>x.id===id); if(!i) return;
  i.hecho = !i.hecho; save(); render();
}
function carry(id){
  const i = S.items.find(x=>x.id===id); if(!i) return;
  i.arrastres = (i.arrastres||0)+1; i.fecha = todayISO();
  save(); closeModal(); render(); toast("Movida a hoy");
}
function carryAll(){
  const today = todayISO(); let n=0;
  S.items.forEach(i=>{ if(!i.hecho && i.fecha<today){ i.arrastres=(i.arrastres||0)+1; i.fecha=today; n++; } });
  save(); render(); toast(n+" pendientes movidos a hoy");
}
function delItem(id){
  S.items = S.items.filter(x=>x.id!==id);
  save(); closeModal(); render(); toast("Entrada eliminada");
}
function backup(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mi-agenda-"+todayISO()+".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Respaldo descargado");
}

/* ============ eventos ============ */
document.addEventListener("click", function(e){
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if(act==="edit"){ const i = S.items.find(x=>x.id===id); if(i) openModal(i); }
  else if(act==="toggle") toggleDone(id);
  else if(act==="close") closeModal();
  else if(act==="save") saveFromModal(id||null);
  else if(act==="delete"){ if(confirm("¿Eliminar esta entrada?")) delItem(id); }
  else if(act==="carry") carry(id);
  else if(act==="carryall") carryAll();
  else if(act==="filter"){ filterProj = t.dataset.id || null; render(); }
  else if(act==="goday"){ cursor = fromISO(t.dataset.date); view="semana"; render(); }
  else if(act==="newat") openModal(null,{hora:t.dataset.hour, tipo:"reunion"});
  else if(act==="newday") openModal(null,{fecha:t.dataset.date});
  else if(act==="portada"){ view="portada"; render(); }
  else if(act==="abrir"){ cursor=new Date(); view="mes"; cursor=new Date(cursor.getFullYear(), cursor.getMonth(), 1); render(); }
  else if(act==="gomes"){ cursor = new Date(cursor.getFullYear(), parseInt(t.dataset.m,10), 1); view="mes"; render(); }
});
document.addEventListener("input", function(e){
  const t = e.target;
  if(t && t.id === "inkColor"){
    S.colorTexto = t.value;
    const m = el("inkMuestra"); if(m) m.style.background = t.value;
    const foco = document.activeElement;
    if(foco && foco.dataset && foco.dataset.nota){
      S.colores[foco.dataset.nota] = t.value;
      foco.style.color = t.value;
    }
    save();
    return;
  }
  if(!t || !t.dataset || !t.dataset.nota) return;
  S.notas[t.dataset.nota] = t.value;
  crecer(t);
  save();
});
document.addEventListener("mousedown", function(e){
  if(e.target.id==="jtScrim") closeModal();
});
document.addEventListener("click", function(e){
  const b = e.target.closest("#jtTipo button"); if(!b) return;
  document.querySelectorAll("#jtTipo button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
});

el("jtToday").onclick = ()=>{ cursor = new Date(); view = "semana"; render(); };
function primerLunes(d){ return startOfWeek(new Date(d.getFullYear(), d.getMonth(), 1)); }
function ultimoLunes(d){ return startOfWeek(new Date(d.getFullYear(), d.getMonth()+1, 0)); }
function saltar(n){
  if(view==="portada"){ cursor = new Date(cursor.getFullYear()+n, cursor.getMonth(), 1); render(); return; }
  if(view==="mes"){
    if(n>0){ view = "semana"; cursor = primerLunes(cursor); }
    else{
      const anterior = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
      view = "semana"; cursor = ultimoLunes(anterior);
    }
    render(); return;
  }
  // semana: avanza hasta salir del mes, y ahí entrega la hoja del mes siguiente
  const lunes = startOfWeek(cursor);
  const mesActual = mesDeSemana(lunes);
  if(n>0){
    const sig = addDays(lunes,7);
    if(mesDeSemana(sig).getTime() !== mesActual.getTime()){ view = "mes"; cursor = mesDeSemana(sig); }
    else cursor = sig;
  }else{
    const ant = addDays(lunes,-7);
    if(mesDeSemana(ant).getTime() !== mesActual.getTime()){ view = "mes"; cursor = mesActual; }
    else cursor = ant;
  }
  render();
}
function mesDeSemana(lunes){
  const jueves = addDays(lunes,3);
  return new Date(jueves.getFullYear(), jueves.getMonth(), 1);
}
el("jtPrev").onclick = ()=> saltar(-1);
el("jtNext").onclick = ()=> saltar(1);
el("jtSearch").addEventListener("input", e=>{ query = e.target.value.trim(); render(); });

document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ closeModal(); return; }
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  if(e.key==="n"||e.key==="N"){ e.preventDefault(); openModal(null); }
  else if(e.key==="t"||e.key==="T"){ cursor = new Date(); render(); }
  else if(e.key==="ArrowLeft") el("jtPrev").click();
  else if(e.key==="ArrowRight") el("jtNext").click();
});


/* ============ deslizar con el dedo (iPad) ============ */
(function(){
  let x0=null, y0=null, t0=0;
  const page = el("jtPage");
  page.addEventListener("touchstart", function(e){
    if(e.touches.length!==1){ x0=null; return; }
    if(view==="portada"){ x0=null; return; }
    if(e.target.closest("input, textarea, select, .mini")){ x0=null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, {passive:true});
  page.addEventListener("touchend", function(e){
    if(x0===null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Date.now()-t0 > 600) return;
    if(Math.abs(dx) < 70 || Math.abs(dy) > 55) return;
    if(el("jtModalHost").firstChild) return;
    (dx < 0 ? el("jtNext") : el("jtPrev")).click();
  }, {passive:true});
})();


/* ============ arranque ============ */
(async function(){
  await load();
  render();
})();

})();
